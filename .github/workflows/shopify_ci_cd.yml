name: Shopify Theme CI/CD

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # Job 1: Check errors and automatically deploy to Development theme
  deploy_development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      # NEW STEP: Scan theme code for syntax errors, missing files, and best practices
      - name: Run Theme Check (Linting and Error detection)
        run: shopify theme check --path=.

      - name: Deploy to Staging Theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          STORE_NAME: ${{ secrets.STORE_NAME }}
          THEME_ID: ${{ secrets.THEME_ID }}
        run: |
          shopify theme push --store=$STORE_NAME --theme=$THEME_ID --path=. --force

  # Job 2: Requires manual Approval before deploying to Live theme
  deploy_live:
    name: Deploy to Live
    runs-on: ubuntu-latest
    needs: deploy_development # Must wait for the "deploy_development" job to complete successfully first
    environment: 
      name: Production # This is the Environment where the required reviewers rule is configured
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Deploy to Live Theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          STORE_NAME: ${{ secrets.STORE_NAME }}
          THEME_ID: ${{ secrets.THEME_ID }} # Using the Live Theme ID variable
        run: |
          shopify theme push --store=$STORE_NAME --theme=$THEME_ID --path=. --force --allow-live
